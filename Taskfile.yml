# https://taskfile.dev

version: '3'

shopt: [globstar]

vars:
  V_GOLANGCILINT: v2.13.1
  V_TRIVY: v0.72.0

tasks:
  default:
    deps:
      - githook:pre-commit

  githook:pre-commit: go tool lefthook run pre-commit --all-files
  githook:pre-push: go tool lefthook run pre-push --all-files

  validate-conventional-commit:
    desc: Validate a conventional commit message (80 char subject limit).
    cmd: go tool sv validate-cc -m 80 -f {{.CLI_ARGS}}

  build:
    desc: Build all binaries in the workspace.
    cmds:
      - go build -ldflags '-s -w' -o bin/ work

  build:docker:
    desc: Build docker image.
    cmds:
      - echo TODO

  clean: rm -rf bin/


  ######################################################################
  # format (write-mode; invoked by lefthook pre-commit)

  format:gofumpt:
    desc: Format Go files with gofumpt.
    cmd: go tool gofumpt -w {{.CLI_ARGS | default "."}}

  format:goimports:
    desc: Organize Go imports.
    cmd: go tool goimports -w {{.CLI_ARGS | default "."}}

  format:cuefmt:
    desc: Format CUE files.
    cmd: go tool cue fmt --files {{.CLI_ARGS | default "."}}

  format:typstyle:
    desc: Format Typst files.
    cmd: typstyle {{.CLI_ARGS | default "."}}

  format:gofix:
    desc: Apply go fix across the workspace.
    cmd: go fix work

  format:govet:
    desc: Run go vet with auto-fix across the workspace.
    cmd: go vet -fix work


  ######################################################################
  # lint

  lint:
    deps:
      - lint:golangci-lint
      - lint:govulncheck
      - lint:gofumpt
      - lint:cuefmt
      - lint:go:fix
      - lint:go:vet
      - lint:typstyle
      #- lint:editorconfig

  lint:full:
    deps:
      - lint
      - lint:trivy

  # FIXME: Intermittant failures, can be flaky.
  lint:check-links:
    cmd: go tool xurls {{.CLI_ARGS | default "**/*.md"}} | grep -Ev '{{.EXCLUDE}}' | sort -u | go tool xurls -fix >/dev/null
    vars:
      EXCLUDE: localhost|twitter|9p.io|cluster.local|catb.org

  lint:golangci-lint:
    cmd: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.V_GOLANGCILINT}} run
    env:
      GOTOOLCHAIN:
        sh: awk '/^go/ {printf("go%s", $2)}' go.mod

  lint:golangci-lint:fix:
    desc: Run golangci-lint and apply auto-fixes.
    cmd: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.V_GOLANGCILINT}} run --fix
    env:
      GOTOOLCHAIN:
        sh: awk '/^go/ {printf("go%s", $2)}' go.mod

  lint:govulncheck: go tool govulncheck work
  lint:gofumpt: go tool gofumpt -l .
  lint:goimports: go tool goimports -l .
  lint:editorconfig:
    desc: Check editorconfig conformance on the given files (whole-repo run is disabled due to OOM).
    cmd: go tool editorconfig-checker {{.CLI_ARGS}}
  lint:cuefmt: go tool cue fmt --files --check .
  lint:go:fix: go fix -diff work
  lint:go:vet: go vet work

  lint:typstyle: typstyle --check .

  lint:trivy:
    desc: Run trivy secret scan.
    cmds:
      - GOEXPERIMENT=jsonv2 go run github.com/aquasecurity/trivy/cmd/trivy@{{.V_TRIVY}} fs --exit-code 1 --scanners secret .

  lint:crap:
    desc: Compute the CRAP (Change Risk Anti-Patterns) metric.
    cmd: go tool go-crap scan {{.CLI_ARGS | default "-t 30 --min 30 --fail-above work"}}

  lint:fix:
    desc: Fix linter errors that can be fixed automatically.
    cmds:
      - go vet -fix work
      - go fix work
      - go tool goimports -w .
      - go tool gofumpt -w .
      - typstyle -i .


  ######################################################################
  # test

  test:
    deps:
      - test:go:integration
      - test:go:build-all-binaries
      - test:go:build-all-tools

  test:go:unit: go tool gotestsum work
  test:go:integration: go tool gotestsum work -tags integration

  test:go:build-all-binaries:
    desc: Build all go binaries in the workspace to ensure no builds fail (e.g. due to dependency bumps).
    aliases: [test:bin]
    cmd: go build -o /dev/null work

  test:go:build-all-tools:
    desc: Build all go tool binaries to ensure no builds fail (e.g. due to dependency bumps).
    aliases: [test:tools]
    cmd: go build -o /dev/null tool


  ######################################################################
  # update

  update:
    desc: Update dependencies.
    cmds:
      - go get -u tool
      - go get -u work
      - go mod tidy
      - go work sync
      - task: test
      - task: lint


  ######################################################################
  # release

  changelogs:
    desc: Regenerate CHANGELOG.md files for all go modules.
    env:
      GOWORK: "off"
    cmds:
      - go tool sv changelog --all --write --exclude skills

  changelogs:commit:
    desc: Commit and push regenerated CHANGELOG.md files if any changed.
    cmds:
      - |
        set -e
        if git status --porcelain | grep -qv '^??'; then
          git add -A
          git commit -m "docs: update changelogs for released versions"
          git push
        else
          echo "No changelog changes to commit"
        fi

  release:cache:
    desc: Pre-download the go tools used by the GHA release job.
    env:
      GOWORK: "off"
    cmds:
      - go tool sv --version
      - go tool task --version

  release:
    desc: Tag, regenerate, commit, and publish GitHub releases for all modules with version bumps.
    env:
      GOWORK: "off"
    vars:
      NEW_TAGS:
        sh: go tool sv next --all | grep -E '^(.*/)?v[0-9]+\.[0-9]+\.[0-9]+$' || true
    cmds:
      - |
        set -e
        if [ -z "{{.NEW_TAGS}}" ]; then
          echo "No version bumps detected"
          exit 0
        fi
        # 1. Regenerate CHANGELOG.md files (emitting the pending versions as dated
        #    entries), commit only the changelog files, and tag at the changelog
        #    commit so each tag points at a commit that contains its own entry.
        go tool sv changelog --all --write --tag --ref main --exclude skills
        # 2. Push the changelog commit and the new tags.
        git push origin main
        git push origin --tags
        # 3. Create a GitHub release per module using its generated changelog entry.
        for tag in {{.NEW_TAGS}}; do
          # Derive the module path from the tag (root tags have no prefix).
          if [[ "$tag" == v* ]]; then
            module="."
          else
            module="${tag%/*}"
          fi
          version="${tag##*/}"
          notes_dir=$(mktemp -d)
          trap 'rm -rf "$notes_dir"' EXIT
          go tool sv changelog --path "$module" --dir "$notes_dir"
          if [ -f "$notes_dir/$version.md" ]; then
            gh release create "$tag" --notes-file "$notes_dir/$version.md"
          else
            gh release create "$tag" --generate-notes
          fi
        done
