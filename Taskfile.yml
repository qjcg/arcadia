# https://taskfile.dev

version: '3'

shopt: [globstar]

vars:
  TAG_CURRENT:
    sh: 'go tool sv current --all'
  TAG_NEXT:
    sh: 'go tool sv next --all'

  V_GOLANGCILINT: v2.12.2

tasks:
  default: [{task: githook:pre-commit}]

  crush: go run github.com/charmbracelet/crush@latest
  githook:pre-commit: go tool lefthook run pre-commit --all-files
  githook:pre-push: go tool lefthook run pre-push --all-files

  clean: rm -rf bin

  lint:
    deps:
      - lint:golangci-lint
      - lint:govulncheck
      - lint:gofumpt

  lint:check-links:
    cmd: go tool xurls **/*.md | grep -Ev '{{.EXCLUDE}}' | sort -u | go tool xurls -fix >/dev/null
    vars:
      EXCLUDE: localhost|twitter|9p.io|cluster.local

  lint:golangci-lint:
    cmd: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.V_GOLANGCILINT}} run
    env:
      GOTOOLCHAIN:
        sh: awk '/^go/ {printf("go%s", $2)}' go.mod

  lint:govulncheck: go tool govulncheck work
  lint:gofumpt: go tool gofumpt -l .
  lint:gofumpt: go tool goimports -l .
  lint:editorconfig: go tool editorconfig-checker .  # FIXME: OOM fail!

  tag:
    desc: Add next semver git tag
    cmds:
      - for: {var: TAG_NEXT, split: "\n"}
        cmd: git tag -a -m {{.ITEM}} {{.ITEM}}
    status:
      - test -z "{{.TAG_NEXT}}"

  tag:dryrun:
    desc: Add next semver git tag (DRY RUN)
    cmds:
      - for: {var: TAG_NEXT, split: "\n"}
        cmd: echo git tag -a -m {{.ITEM}} {{.ITEM}}
    status:
      - test -z "{{.TAG_NEXT}}"

  tag:list-current:
    desc: List current semver git tags
    cmd: go tool sv current --all

  tag:push:
    desc: Push git tags
    deps: [tag]
    cmds:
      - git push --tags

  test:
    deps:
      - test:go-integration
      - test:go-tools

  test:go-unit: go tool gotestsum work
  test:go-integration: go tool gotestsum work -tags integration

  test:go-tools:
    desc: Test go tools to ensure none are broken due to dependency updates.
    cmd: go build -o /dev/null tool
