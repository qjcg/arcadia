version: '3'

tasks:
  build:
    desc: Build the elbereth compiler
    cmds:
      - go build -o elbereth ./cmd/elbereth

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f elbereth

  test:
    desc: Run all tests and examples
    cmds:
      - task: build
      - ./elbereth check test.elb
      - ./elbereth run examples/hello.elb
      - ./elbereth run examples/functions.elb
      - ./elbereth run examples/conditionals.elb
      - ./elbereth run examples/structs.elb
      - ./elbereth run examples/concurrency.elb
      - ./elbereth run examples/showcase.elb
      - ./elbereth run test_return.elb
      - ./elbereth run test_struct.elb
      - ./elbereth run test_chan.elb
      - ./elbereth run test_match.elb
      - ./elbereth run test_defer.elb
      - ./elbereth run test_import.elb
      - ./elbereth run test_macro.elb
      - ./elbereth run test_union.elb
      - ./elbereth run test_loop.elb
      - go test ./internal/...

  run:
    desc: Run an example (pass FILE=path/to/file.elb)
    cmds:
      - ./elbereth run {{.FILE}}

  repl:
    desc: Start the Elbereth interactive REPL
    cmds:
      - ./elbereth repl

  check:
    desc: Check a file without running (pass FILE=path/to/file.elb)
    cmds:
      - ./elbereth check {{.FILE}}

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./internal/...
