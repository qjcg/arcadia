version: '3'

vars:
  BIN_DIR: bin
  BIN: '{{.BIN_DIR}}/elbereth'
  BIN_INSTALLED: $GOBIN/elbereth

tasks:
  build:
    desc: Build the elbereth compiler
    cmds:
      - CGO_ENABLED=0 go build -ldflags '-s -w' -o {{.BIN}} ./cmd/elbereth
    sources:
      - '**/*.go'
      - 'go.*'
    generates:
      - '{{.BIN}}'

  install:
    deps: [build]
    cmd: cp {{.BIN}} $GOBIN
    sources:
      - '{{.BIN}}'
    generates:
      - '{{.BIN_INSTALLED}}'

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  test:
    desc: Run all tests and examples
    deps: [build]
    cmds:
      - bash -c 'for f in examples/*_test.elb; do echo "Testing $f..."; {{.BIN}} test "$f" || exit 1; done'
      - go test ./internal/...

  run:
    desc: Run an example (pass FILE=path/to/file.elb)
    deps: [build]
    cmds:
      - '{{.BIN}} run {{.FILE}}'

  repl:
    desc: Start the Elbereth interactive REPL
    deps: [build]
    cmds:
      - '{{.BIN}} repl'

  check:
    desc: Check a file without running (pass FILE=path/to/file.elb)
    deps: [build]
    cmds:
      - '{{.BIN}} check {{.FILE}}'

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./internal/...
