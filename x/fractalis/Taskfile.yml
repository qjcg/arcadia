# https://taskfile.dev

version: "3"

vars:
  TMP_DIR: tmp
  BIN_DIR: bin
  BIN: '{{.BIN_DIR}}/fractalis'
  BIN_INSTALLED: $GOBIN/fractalis

tasks:
  default: [{ task: build }]

  build:
    desc: Build the binary
    cmds:
      - go build -ldflags '-s -w' -o {{.BIN}} ./cmd/fractalis
      - upx {{.BIN}}
    sources:
      - '*.go'
      - 'go.*'
    generates:
      - '{{.BIN}}'

  install:
    desc: Install go binary
    deps: [build]
    cmds:
      - cp {{.BIN}} $GOBIN
    sources:
      - '**/*.go'
      - 'go.*'
    generates:
      - '{{.BIN_INSTALLED}}'

  reinstall:
    desc: Clean re-install go binary.
    cmds:
      - task: clean
      - task: uninstall
      - task: install

  uninstall:
    desc: Uninstall go binary
    cmds:
      - rm -f {{.BIN_INSTALLED}}
    status:
      - test ! -x {{.BIN_INSTALLED}}

  test:
    desc: Run tests
    cmds:
      - go test -cover ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} {{.TMP_DIR}}

  dev-3d:
    desc: Run 3D mode with hot reload using air
    cmds:
      - go tool air --build.cmd "go run . --3d"

  wasm-3d:
    desc: Serve 3D mode as WebAssembly in browser
    cmds:
      - go run github.com/hajimehoshi/wasmserve@latest ./cmd/3d
