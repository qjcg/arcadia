# https://taskfile.dev

version: "3"

vars:
  BIN_DIR: bin
  BIN: '{{.BIN_DIR}}/fractals'

tasks:
  default: [{ task: build }]

  build:
    desc: Build the fractals binary
    cmds:
      - CGO_ENABLED=0 go build -ldflags '-s -w' -o {{.BIN}}
      - upx {{.BIN}}
    sources:
      - '*.go'
      - 'go.*'
    generates:
      - '{{.BIN}}'

  install:
    desc: Install go binary
    deps: [build]
    cmds:
      - cp {{.BIN}} $GOBIN
    sources:
      - '**/*.go'
      - 'go.*'
    generates:
      - $GOBIN/fractals

  uninstall:
    desc: Uninstall go binary
    cmds:
      - rm -f $GOOBIN/fractals

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  demo:
    desc: Show all color schemes
    deps: [build]
    cmds:
      - echo "=== Grayscale (default) ==="
      - ./{{.BIN_DIR}}/fractals -w 80 -h 30
      - echo ""
      - echo "=== Blue ==="
      - ./{{.BIN_DIR}}/fractals -w 80 -h 30 -c blue
      - echo ""
      - echo "=== Rainbow ==="
      - ./{{.BIN_DIR}}/fractals -w 80 -h 30 -c rainbow
      - echo ""
      - echo "=== Zoomed (Rainbow) ==="
      - ./{{.BIN_DIR}}/fractals -w 80 -h 30 -c rainbow -x -0.7 -y 0.0 -z 2.0
