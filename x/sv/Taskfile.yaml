version: '3'

tasks:
  default:
    deps:
      - test

  build:
    desc: Build the sv binary
    cmds:
      - CGO_ENABLED=0 go build -ldflags '-s -w' -o sv ./cmd/sv
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - sv

  install:
    desc: Install the sv binary
    deps: [build]
    cmds:
      - go install ./cmd/sv
      - upx $GOBIN/sv

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f sv
