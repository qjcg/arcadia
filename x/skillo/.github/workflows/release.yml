name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        go-version: 1.21
    - run: go build -o skillo ./pkg/cmd/skillo
    - uses: actions/upload-artifact@v2
      with:
        name: skillo
        path: skillo