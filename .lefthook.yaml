# See https://lefthook.dev/configuration/

_gofiles: &gofiles
  - "*.go"
  - "go.{mod,sum,work,work.sum}"

commit-msg:
  parallel: true
  jobs:
    - name: header-is-within-max-length
      run: go tool sv validate-cc -m 80 -f {1}

    - name: header-is-conventional-commit
      run: go tool sv validate-cc -f {1}


pre-commit:
  parallel: true
  jobs:
    - name: formatters
      group:
        parallel: true
        jobs:
          - name: gofumpt
            run: go tool gofumpt -w {staged_files}
            glob: "*.go"
            stage_fixed: true

          - name: goimports
            run: go tool goimports -w {staged_files}
            glob: "*.go"
            stage_fixed: true

          - name: cue fmt
            run: go tool cue fmt --files {staged_files}
            glob: "*.cue"
            stage_fixed: true

          - name: editorconfig-checker
            run: go tool editorconfig-checker {staged_files}

    - name: unit-tests
      run: go test work
      glob: *gofiles

pre-push:
  piped: true
  jobs:
    - name: security
      group:
        parallel: true
        jobs:
          - name: govulncheck
            run: go tool govulncheck work
            glob: *gofiles

          - name: 'trivy (scanners: secret)'
            run: GOEXPERIMENT=jsonv2 go run github.com/aquasecurity/trivy/cmd/trivy@latest fs --exit-code 1 --scanners secret .

    - name: linters
      group:
        parallel: true
        jobs:
          - name: golangci-lint
            run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --fix
            glob: *gofiles
            stage_fixed: true

          - name: check-links
            run: go tool xurls {files} | grep -Ev 'localhost|twitter|9p.io|cluster.local|catb.org' | sort -u | go tool xurls -fix
            glob:
              - "*.md"
              - "**/*.md"
            stage_fixed: true

    - name: integration-tests
      run: go test -tags integration work
      glob: *gofiles
