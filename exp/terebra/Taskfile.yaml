version: '3'

vars:
  BIN: terebra

tasks:
  default:
    deps: [run]

  build:
    desc: Build the terebra binary
    cmds:
      - CGO_ENABLED=0 go build -ldflags '-s -w' -o {{.BIN}} ./cmd/terebra
      - upx {{.BIN}}
    sources:
      - '**/*.go'
      - '**/go.*'
    generates:
      - '{{.BIN}}'

  install:
    deps: [build]
    cmds:
      - cp {{.BIN}} $GOBIN

  run:
    desc: Run the terebra REPL
    deps: [build]
    cmds:
      - ./terebra

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test-parser:
    desc: Run parser tests only
    cmds:
      - go test ./internal/parser/ -v

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f terebra
