version: '3'

vars:
  BIN: terebra

tasks:
  default:
    deps: [run]

  build:
    desc: Build the terebra binary
    cmds:
      - CGO_ENABLED=0 go build -ldflags '-s -w' -o {{.BIN}} .
      - upx {{.BIN}}
    sources:
      - '**/*.go'
      - '**/go.*'
    generates:
      - '{{.BIN}}'

  install:
    deps: [build]
    cmds:
      - cp {{.BIN}} $GOBIN

  run:
    desc: Run the terebra REPL
    deps: [build]
    cmds:
      - ./{{.BIN}}

  test:
    desc: Run all tests (with race detector)
    cmds:
      - go test ./... -race

  crap:
    desc: Run go-crap scan, fail if any function exceeds CRAP threshold
    cmd: go tool go-crap scan {{.CLI_ARGS | default "--min 30 -t 30 --fail-above"}}

  crap-baseline:
    desc: Regenerate the go-crap baseline report
    cmds:
      - go tool go-crap scan --min 0 -t 30 -f json -o baseline.json

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BIN}}
