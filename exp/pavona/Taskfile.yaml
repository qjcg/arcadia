version: "3"

vars:
  BIN_DIR: bin
  BIN_NAME: pavona
  BIN: '{{.BIN_DIR}}/{{.BIN_NAME}}'
  INSTALLED_BIN: $GOPATH/bin/{{.BIN_NAME}}

tasks:
  default:
    deps:
      - test

  build:
    desc: Build the pavona CLI
    sources:
      - '**/*.go'
      - '**/go.*'
    generates:
      - '{{.BIN}}'
    cmds:
      - go build -o "{{.BIN}}" .

  install:
    desc: Install pavona to GOBIN
    deps: [build]
    cmds:
      - cp {{.BIN}} $GOPATH/bin
      - upx $GOPATH/bin/

  test:
    desc: Run all tests (godog BDD scenarios)
    cmds:
      - go test ./...

  test:short:
    desc: Run tests with short mode
    cmds:
      - go test -short ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  dev:
    desc: Run tests with verbose output on file change (requires watchexec)
    cmds:
      - watchexec -w . -- go test -count=1 -v ./...
    silent: true
