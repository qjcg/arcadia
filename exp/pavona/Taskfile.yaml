version: "3"

vars:
  BIN_DIR: bin
  BIN_NAME: pavona

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the pavona CLI
    cmds:
      - go build -o "{{.BIN_DIR}}/{{.BIN_NAME}}" .

  install:
    desc: Install pavona to GOBIN
    cmds:
      - go install .

  test:
    desc: Run all tests (godog BDD scenarios)
    cmds:
      - go test -count=1 ./...

  test:short:
    desc: Run tests with short mode
    cmds:
      - go test -count=1 -short ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  dev:
    desc: Run tests with verbose output on file change (requires watchexec)
    cmds:
      - watchexec -w . -- go test -count=1 -v ./...
    silent: true
